 X.save();X.filter='sepia(.35) saturate(1.4) brightness(1.15)';(OV.puffs||[]).forEach(q=>{X.globalAlpha=Math.max(0,q.op);X.drawImage(q.im,q.x-q.sz/2,q.y-q.sz/2,q.sz,q.sz);});X.restore();X.globalAlpha=1;
 if(OV.fx&&OV.fx.show&&OV.fx.k>0)stroked('*SCHNUPPER*',OV.fx.x,OV.fx.y+45,76,'#fff',-8*Math.PI/180,OV.fx.k);
 if(OV.emo&&OV.emo.show&&OV.emo.k>0){X.save();X.translate(OV.emo.x+75,OV.emo.y+75);X.scale(OV.emo.k,OV.emo.k);X.shadowColor='rgba(0,0,0,.35)';X.shadowBlur=14;X.shadowOffsetY=8;X.drawImage(EMO,-75,-75,150,150);X.restore();}
 const cap=OV.cap||[];if(cap.length){let fs=86;X.font=`900 ${fs}px Mont`;const gap=24;const tw=()=>cap.reduce((s,c)=>s+X.measureText(c.w).width,0)+gap*(cap.length-1);while(tw()>696&&fs>40){fs-=4;X.font=`900 ${fs}px Mont`;}
  let x=540-tw()/2;const y=1105+fs*0.62;X.save();X.shadowColor='rgba(0,0,0,.45)';X.shadowBlur=14;X.shadowOffsetY=8;cap.forEach(c=>{const w=X.measureText(c.w).width;stroked(c.w,x+w/2,y,fs,c.col,0,lerp(.5,1,c.k));x+=w+gap;X.font=`900 ${fs}px Mont`;});X.restore();}}
import {Muxer,ArrayBufferTarget} from './lib/mp4-muxer.mjs';
const FPS=60,DUR=6.0,N=Math.round(DUR*FPS);let VIDEO=null;const st=$('st');
async function go(){$('go').disabled=true;const t0=performance.now();
 const mux=new Muxer({target:new ArrayBufferTarget(),video:{codec:'avc',width:1080,height:1920,frameRate:FPS},fastStart:'in-memory'});
 const enc=new VideoEncoder({output:(c,m)=>mux.addVideoChunk(c,m),error:e=>{st.textContent='Encoder-Fehler: '+e.message;}});
 enc.configure({codec:'avc1.640034',width:1080,height:1920,bitrate:28e6,framerate:FPS,hardwareAcceleration:'prefer-hardware',avc:{format:'avc'}});
 for(let f=0;f<N;f++){window.render(f/FPS);compose();const vf=new VideoFrame(OUT,{timestamp:Math.round(f*1e6/FPS),duration:Math.round(1e6/FPS)});enc.encode(vf,{keyFrame:f%60===0});vf.close();
  while(enc.encodeQueueSize>6)await new Promise(r=>setTimeout(r,2));if(f%10===0){st.textContent=`Rendere Bild ${f+1}/${N} · ${((performance.now()-t0)/1000).toFixed(1)} s`;await new Promise(r=>setTimeout(r,0));}}
 await enc.flush();mux.finalize();VIDEO=new Blob([mux.target.buffer],{type:'video/mp4'});
 const secs=((performance.now()-t0)/1000).toFixed(1);st.textContent=`Fertig: ${N} Bilder in ${secs} s (${(VIDEO.size/1e6).toFixed(1)} MB). `;window.RESULT={secs,size:VIDEO.size};$('sv').disabled=false;}

$("go").onclick=go;window.go=go;window.compose=compose;
import {pickDir,dirStatus,ensurePerm,saveToDir} from './lib/savedir.js';
async function showDir(){const d=await dirStatus();$('dir').textContent=d.name?('Ordner: '+d.name+' ('+(d.perm==='granted'?'Schreibzugriff ok':'Zugriff bestätigen')+')'):'Kein Ordner gewählt';return d;}
$('pick').onclick=async()=>{try{await pickDir();await ensurePerm();}catch(e){$('dir').textContent='Abgebrochen: '+e.message;}showDir();};
showDir();window.dirStatus=dirStatus;
const save=async()=>{const name=(window.OUTNAME||'render.mp4');try{const p=await saveToDir(name,VIDEO);st.textContent+='\nGespeichert in '+p+' ✓';window.SAVED=p;return p;}catch(e){st.textContent+='\nOrdner-Speichern ging nicht ('+e.message+'), Download stattdessen';const a=document.createElement('a');a.href=URL.createObjectURL(VIDEO);a.download=name;document.body.appendChild(a);a.click();window.SAVED='download';return 'download';}};$('sv').onclick=save;window.save=save;
window.init(WORDS_EMB);window.DBG={AO,BLOOM,BOK,R,S,COMP,KEY,CAM,HERO,NPC,THREE};window.PLAIN=false;window.ready=true;st.textContent='Szene geladen. Bereit.';
</script></body></html>
